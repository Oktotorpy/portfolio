<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css" />
    <title>Portfolio CMS</title>
    <script>
      // CineVote theme, applied before first paint so the page never flashes the
      // wrong palette. Mirrors $lib/cinevoteTheme.js; only /cinevote uses it.
      (function () {
        try {
          if (location.pathname.indexOf('/cinevote') !== 0) return;
          var m = localStorage.getItem('cv.theme.mode');
          var a = localStorage.getItem('cv.theme.accent');
          var accents = ['amber', 'blue', 'green', 'magenta', 'cyan', 'red'];
          document.documentElement.setAttribute('data-cv-theme', m === 'light' ? 'light' : 'dark');
          document.documentElement.setAttribute('data-cv-accent', accents.indexOf(a) >= 0 ? a : 'amber');
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
